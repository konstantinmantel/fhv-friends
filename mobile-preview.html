<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f2f1ed">
  <meta name="description" content="FHV Friends in einer iPhone-15-Pro-Handyvorschau am Laptop ansehen.">
  <title>FHV Friends · Handy-Vorschau</title>
  <style>
    :root{font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#202c34;background:#f2f1ed;font-synthesis:none;text-rendering:optimizeLegibility}
    *{box-sizing:border-box}
    body{margin:0;min-width:320px;min-height:100vh}
    .shell{min-height:100vh;display:grid;grid-template-rows:auto 1fr auto;padding:0 26px 18px}
    .topbar{height:74px;display:flex;align-items:center;justify-content:space-between;gap:20px;border-bottom:1px solid #ddded9}
    .brand{font-size:14px;letter-spacing:.13em;font-weight:800;color:#26343a;text-decoration:none}
    .brand span{color:#54a7d7}
    .actions{display:flex;align-items:center;gap:10px}
    .actions a,.actions button{font:inherit;font-size:13px;font-weight:600;color:#35464d;text-decoration:none;border:1px solid #d3d7d4;background:#fff;border-radius:999px;padding:10px 15px;cursor:pointer}
    .actions a:hover,.actions button:hover{background:#e7f3f8;border-color:#91c9e5}
    .stage{--scale:1;min-height:0;display:flex;align-items:center;justify-content:center;padding:12px 0}
    .device{width:423px;height:882px;padding:15px;border-radius:57px;background:linear-gradient(145deg,#555b61,#141719 30%,#24292d 70%,#666c71);box-shadow:0 28px 70px #27343b35,0 3px 8px #12191c40;transform:scale(var(--scale));transform-origin:center;position:relative;flex:none}
    .screen{width:393px;height:852px;border-radius:43px;overflow:hidden;background:#fff;position:relative}
    iframe{display:block;width:393px;height:852px;border:0;background:white}
    .island{position:absolute;top:23px;left:50%;transform:translateX(-50%);width:119px;height:33px;border-radius:22px;background:#090a0a;pointer-events:none}
    .home{position:absolute;bottom:7px;left:50%;transform:translateX(-50%);height:5px;width:132px;border-radius:9px;background:#161616;pointer-events:none}
    .caption{min-height:30px;text-align:center;font-size:12px;color:#68757a}
    @media(max-width:560px){.shell{padding:0 12px 12px}.topbar{height:auto;min-height:66px;flex-wrap:wrap;padding:12px 0}.actions{gap:6px}.actions a,.actions button{padding:8px 10px;font-size:12px}}
  </style>
</head>
<body>
  <main class="shell" id="shell">
    <header class="topbar">
      <a class="brand" href="https://fhv-friends.netlify.app/" aria-label="FHV Friends"><span>FHV</span> FRIENDS · HANDY-VORSCHAU</a>
      <nav class="actions" aria-label="Ansicht">
        <a href="https://fhv-friends.netlify.app/" target="_blank" rel="noopener">Normale Website ↗</a>
        <button id="fullscreen" type="button">Präsentieren ⛶</button>
      </nav>
    </header>
    <section class="stage" id="stage" aria-label="iPhone 15 Pro Vorschau">
      <div class="device">
        <div class="screen">
          <iframe src="https://fhv-friends.netlify.app/" title="FHV Friends in einer 393 Pixel breiten Handyansicht" allow="clipboard-read; clipboard-write"></iframe>
          <span class="island" aria-hidden="true"></span>
          <span class="home" aria-hidden="true"></span>
        </div>
      </div>
    </section>
    <footer class="caption">Die Vorschau zeigt die bestehende Website mit 393 CSS-Pixeln Breite. Die normale Desktop-Seite bleibt unverändert.</footer>
  </main>
  <script>
    const shell=document.querySelector('#shell');
    const stage=document.querySelector('#stage');
    function fit(){
      const scale=Math.min(1,(innerWidth-52)/423,(stage.clientHeight-24)/882);
      stage.style.setProperty('--scale',Math.max(.42,scale));
    }
    addEventListener('resize',fit);
    document.querySelector('#fullscreen').addEventListener('click',async()=>{
      try{if(!document.fullscreenElement)await shell.requestFullscreen();else await document.exitFullscreen();}catch{}
    });
    document.addEventListener('fullscreenchange',fit);
    fit();
  </script>
</body>
</html>
